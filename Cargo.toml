[package]
name = "sessions"
version = "0.1.0"
edition = "2024"

[dependencies]
arrow-array = "60.1.0"
arrow-schema = "60.1.0"
memchr = "2.8.3"
memmap2 = "0.9.12"
mimalloc = "0.1.52"
parquet = { version = "60.1.0", default-features = false, features = ["arrow"] }
rustc-hash = "2.1.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
